spring.application.name=GestaoDeAcao
spring.config.import=optional:file:.env[.properties]
spring.profiles.default=h2
spring.liquibase.enabled=true
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.http.clients.connect-timeout=${HTTP_CLIENT_CONNECT_TIMEOUT:2s}
spring.http.clients.read-timeout=${HTTP_CLIENT_READ_TIMEOUT:5s}

twelvedata.api.key=${TWELVE_DATA_API_KEY}
integracoes.brapi.base-url=${BRAPI_BASE_URL:https://brapi.dev}
integracoes.brasilapi.base-url=${BRASIL_API_BASE_URL:https://brasilapi.com.br}
integracoes.viacep.base-url=${VIACEP_BASE_URL:https://viacep.com.br}
integracoes.twelvedata.base-url=${TWELVE_DATA_BASE_URL:https://api.twelvedata.com}
integracoes.cvm.base-url=${CVM_BASE_URL:https://dados.cvm.gov.br}
integracoes.cvm.cadastro-path=${CVM_CADASTRO_PATH:/dados/INTERMED/CAD/DADOS/cad_intermed.zip}
integracoes.cvm.cache-ttl=${CVM_CACHE_TTL:24h}
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml
